[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "9lives"
version = "0.2.0"
description = "Self-healing QA for the coding-agent era. Your tests have nine lives."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "QualityMax" }]
keywords = ["playwright", "cypress", "selenium", "testing", "self-healing", "qa", "ai", "agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
# LLM SDKs are optional: Tier 1 healing is fully offline.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["anthropic>=0.40", "openai>=1.50"]

[project.scripts]
"9lives" = "ninelives.cli:main"
"9l" = "ninelives.cli:main"

[project.urls]
Homepage = "https://9lives.run"
Repository = "https://github.com/Quality-Max/9lives"

[tool.hatch.build.targets.wheel]
packages = ["src/ninelives"]

[tool.ruff]
line-length = 127
target-version = "py310"
