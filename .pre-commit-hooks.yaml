# 9lives as a pre-commit hook — heal failing specs before they reach CI.
#
#   repo: https://github.com/Quality-Max/9lives
#   rev: v0.2.1
#   hooks:
#     - id: 9lives-heal
#
# Both hooks need the runtime the spec's framework needs (Node for
# Playwright/Cypress, pytest for Selenium) available on PATH.
- id: 9lives-heal
  name: 9lives — heal failing specs
  description: Run changed specs through Python healing; drifted selectors are fixed in place, assertion failures still block the commit.
  entry: python -m ninelives.cli heal --yes
  language: python
  files: '(\.(spec|test)\.[cm]?[jt]sx?|\.cy\.[cm]?[jt]sx?)$'
  pass_filenames: true
  verbose: true

- id: 9lives-run
  name: 9lives — run specs (no healing)
  description: Run changed specs through Python and fail the commit on red, without modifying anything.
  entry: python -m ninelives.cli run
  language: python
  files: '(\.(spec|test)\.[cm]?[jt]sx?|\.cy\.[cm]?[jt]sx?)$'
  pass_filenames: true
